site_name: VINEYARD.RUN Documentation
site_description: >-
  User guide, developer documentation, and the marketplace browser for the
  VINEYARD.RUN Plugin Pack and Type Pack ecosystem.
site_author: vineyard-run
site_url: https://docs.vineyard.run/
copyright: Copyright &copy; VINEYARD.RUN

# Fully static output. `mkdocs build` produces ./site_html with no server requirement.
docs_dir: docs
site_dir: site_html
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
    # No `logo:` here. `theme.logo` above takes precedence over `theme.icon.logo`, so the
    # `material/grape` that used to sit here never rendered — it just looked like the header
    # mark was configured in two places that disagreed.
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/community.js

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://vineyard.run
      name: VINEYARD.RUN homepage

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
        - locale: ko
          name: 한국어
          nav_translations:
            Home: 홈
            Marketplace: 마켓플레이스
            "User Guide": 사용자 가이드
            "Getting started": 시작하기
            "Browse & install": 둘러보기 & 설치
            "Running plugins": 플러그인 실행
            "Working with Type Packs": Type Pack 사용하기
            "The canvas": 캔버스
            "Tasks & runs": 태스크 & 실행
            "Working with Skill Packs": Skill Pack 사용하기
            "Developer Guide": 개발자 가이드
            "Architecture & principles": 아키텍처 & 원칙
            "Quickstart — your first plugin": 퀵스타트 - 첫 플러그인
            "Plugin manifest": 플러그인 매니페스트
            "Plugin Packs": 플러그인 팩
            "Type Packs": Type Pack
            "SDK & host context": SDK & 호스트 컨텍스트
            "Sandbox & security": 샌드박스 & 보안
            "Task lifecycle": 태스크 생명주기
            Distribution: 배포
            "Skill Packs": Skill Pack
            "Publishing to the registry": 레지스트리에 배포하기
            Updates: 업데이트
            Reference: 레퍼런스
            "Plugin manifest schema": 플러그인 매니페스트 스키마
            "Type Pack schema": Type Pack 스키마
            "Registry entry schemas": 레지스트리 엔트리 스키마
            "Scopes reference": 스코프 레퍼런스
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Marketplace:
      - marketplace.md
  - User Guide:
      - guide/index.md
      - Getting started: guide/getting-started.md
      - Browse & install: guide/installing.md
      - Running plugins: guide/running-plugins.md
      - Working with Type Packs: guide/typepacks.md
      - Working with Skill Packs: guide/skillpacks.md
      - The canvas: guide/canvas.md
      - Tasks & runs: guide/tasks.md
  - Developer Guide:
      - develop/index.md
      - Architecture & principles: develop/architecture.md
      - Quickstart — your first plugin: develop/quickstart.md
      - Plugin manifest: develop/plugin-manifest.md
      - Plugin Packs: develop/plugin-packs.md
      - Type Packs: develop/typepacks.md
      - SDK & host context: develop/sdk.md
      - Sandbox & security: develop/security.md
      - Task lifecycle: develop/lifecycle.md
      - Distribution: develop/distribution.md
      - Skill Packs: develop/skillpacks.md
      - Publishing to the registry: develop/publishing.md
      - Updates: develop/updates.md
  - Reference:
      - reference/index.md
      - Plugin manifest schema: reference/plugin-schema.md
      - Type Pack schema: reference/typepack-schema.md
      - Registry entry schemas: reference/registry-schema.md
      - Scopes reference: reference/scopes.md
